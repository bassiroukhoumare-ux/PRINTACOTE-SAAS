# Configuration Supabase CLI.
# Remplace project_id par la référence de ton projet (Settings > General).
project_id = "printacote-saas"

# Désactivé pour le dev local : le conteneur "vector" est incompatible avec
# Colima (montage du docker.sock non supporté). Inutile pour servir les fonctions.
[analytics]
enabled = false

# Le checkout exige un utilisateur connecté → JWT vérifié.
[functions.moneroo-checkout]
verify_jwt = true

# Moneroo appelle le webhook sans token utilisateur → pas de vérification JWT.
# La sécurité repose sur la signature HMAC X-Moneroo-Signature.
[functions.moneroo-webhook]
verify_jwt = false

# PayTech checkout exige un utilisateur connecté
[functions.paytech-checkout]
verify_jwt = true

# PayTech appelle le webhook (IPN) sans token utilisateur -> pas de vérification JWT
[functions.paytech-webhook]
verify_jwt = false

# GeniusPay checkout exige un utilisateur connecté
[functions.geniuspay-checkout]
verify_jwt = true

# GeniusPay appelle le webhook sans token utilisateur -> pas de vérification JWT.
# La sécurité repose sur la signature HMAC X-Webhook-Signature.
[functions.geniuspay-webhook]
verify_jwt = false

# Récupération de mot de passe : appelée avant login -> pas de JWT.
# La sécurité repose sur le rate limit Redis + le REVOKE de la RPC.
[functions.recovery-request]
verify_jwt = false

# Message support : imprimeur connecté -> JWT vérifié.
[functions.support-message]
verify_jwt = true

# Liste publique des imprimeurs (cache Redis) : pas de JWT.
[functions.printers-list]
verify_jwt = false

# Stats globales admin (cache Redis) : pas de JWT, gardée par x-admin-token.
[functions.admin-stats]
verify_jwt = false
